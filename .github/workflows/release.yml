name: Release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest version must match the tag
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "manifest.json version $v != tag $GITHUB_REF_NAME"; exit 1; }
          node -e "const v=require('./versions.json'); if(!v['$GITHUB_REF_NAME']) { console.error('versions.json lacks $GITHUB_REF_NAME'); process.exit(1) }"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: bridge/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Install with BRAT: \`englishcompiler/tcsync\`. Setup guide: https://github.com/englishcompiler/tcsync/blob/main/docs/setup.md"
            echo
            echo "main.js sha256: \`$(sha256sum main.js | cut -d' ' -f1)\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --notes-file notes.md
